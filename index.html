<!DOCTYPE html>
<!--
  ======================================================================
  🍓 BITÁCORA DEL INVERNADERO — index.html
  ======================================================================
-->
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Invernadero</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#2F4A2B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Invernadero">

<!-- Firebase (sincronización en la nube en tiempo real, con soporte sin conexión) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>

<style>
  :root{
    --moss: #2F4A2B;
    --moss-dark: #1E3220;
    --soil: #6B4A2F;
    --fresa: #D62E4E;
    --fresa-dark: #A81F3A;
    --hoja: #7FA35C;
    --crema: #FAF6EE;
    --crema-2: #F1EADA;
    --tinta: #2A2620;
    --linea: #DCD2BA;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0; overflow-x:hidden; width:100%;}
  body{
    background: var(--crema);
    color: var(--tinta);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-bottom: 84px;
    min-height: 100vh;
  }
  header{
    background: linear-gradient(135deg, var(--moss) 0%, var(--moss-dark) 100%);
    color: var(--crema);
    padding: 22px 20px 26px;
    position: relative;
    overflow: hidden;
  }
  header::after{
    content:"";
    position:absolute;
    right:-30px; top:-30px;
    width:140px; height:140px;
    border-radius:50%;
    background: rgba(214,46,78,0.18);
  }
  header h1{
    font-family: Georgia, "Times New Roman", serif;
    font-size: 26px;
    font-weight: 700;
    margin: 0 0 4px 0;
    letter-spacing: 0.2px;
    position: relative;
  }
  header p{
    margin:0;
    font-size: 13px;
    opacity: 0.85;
    position: relative;
  }
  .sync-badge{
    position: relative;
    margin-top: 8px;
    display: inline-block;
    font-size: 11.5px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 20px;
    letter-spacing: 0.2px;
    background: rgba(255,255,255,0.14);
    color: var(--crema);
  }
  .sync-badge--ok{ background: rgba(127,163,92,0.35); }
  .sync-badge--offline{ background: rgba(214,46,78,0.28); }
  .sync-badge--saving{ background: rgba(255,255,255,0.22); }
  .wrap{ max-width: 560px; margin: 0 auto; padding: 16px; }
  .card{
    background: #fff;
    border: 1px solid var(--linea);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
    overflow: hidden;
  }
  .card h2{
    font-family: Georgia, serif;
    font-size: 15px;
    color: var(--moss-dark);
    margin: 0 0 12px 0;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    border-bottom: 2px solid var(--crema-2);
    padding-bottom: 8px;
  }
  label{
    display:block;
    font-size: 12.5px;
    font-weight: 600;
    color: #6b6350;
    margin: 12px 0 5px 0;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  label:first-child{ margin-top:0; }
  select, input[type=date], input[type=text], textarea, input[type=number]{
    width: 100%;
    padding: 11px 12px;
    border: 1.5px solid var(--linea);
    border-radius: 9px;
    font-size: 15px;
    background: var(--crema);
    color: var(--tinta);
    font-family: inherit;
  }
  textarea{ min-height: 64px; resize: vertical; }
  .userpicker{ display:flex; gap:8px; }
  .userpicker button{
    flex:1;
    padding: 12px 8px;
    border-radius: 9px;
    border: 1.5px solid var(--linea);
    background: var(--crema);
    font-size: 14.5px;
    font-weight: 600;
    color: var(--tinta);
  }
  .userpicker button.active{
    background: var(--moss);
    border-color: var(--moss);
    color: #fff;
  }
  .chk-grid{ display:flex; flex-direction:column; gap:2px; }
  .chk-row{
    display:flex;
    align-items:center;
    gap: 10px;
    padding: 10px 4px;
    border-bottom: 1px solid var(--crema-2);
  }
  .chk-row:last-child{ border-bottom:none; }
  .chk-row input[type=checkbox]{
    width: 22px; height: 22px;
    accent-color: var(--fresa);
    flex-shrink:0;
  }
  .chk-row span{ font-size: 14.5px; }
  .btn-primary{
    width:100%;
    padding: 14px;
    background: var(--fresa);
    color:#fff;
    border:none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 700;
    margin-top: 16px;
    letter-spacing: 0.2px;
  }
  .btn-secondary{
    width:100%;
    padding: 12px;
    background: #fff;
    color: var(--moss-dark);
    border: 1.5px solid var(--moss);
    border-radius: 10px;
    font-size: 14.5px;
    font-weight: 700;
    margin-top: 10px;
  }
  .entry{
    background:#fff;
    border:1px solid var(--linea);
    border-left: 5px solid var(--fresa);
    border-radius: 10px;
    padding: 13px 14px;
    margin-bottom: 10px;
  }
  .entry-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .entry-title{ font-weight:700; font-size:15px; }
  .entry-meta{ font-size:12.5px; color:#8a8270; margin-top:2px; }
  .badge{
    display:inline-block; font-size:11.5px; font-weight:700;
    padding: 3px 9px; border-radius:20px; margin-top:6px; margin-right:5px;
    background: var(--crema-2); color: var(--moss-dark);
  }
  .entry-notes{ font-size:13.5px; margin-top:8px; color:#3f3a2f; line-height:1.4; }
  .empty{ text-align:center; padding: 40px 20px; color:#9a917a; font-size:14px; }
  .empty .big{ font-size:34px; margin-bottom:8px; }
  nav.tabbar{
    position: fixed; bottom:0; left:0; right:0;
    background: #fff; border-top: 1px solid var(--linea);
    display:flex; max-width:560px; margin:0 auto;
    overflow-x:auto;
  }
  nav.tabbar button{
    flex:1 0 auto; min-width:58px; padding: 10px 4px 8px; background:none; border:none;
    font-size: 10px; font-weight:700; color:#a39a83; white-space:nowrap;
  }
  nav.tabbar button .ic{ display:block; font-size:18px; margin-bottom:2px; }
  nav.tabbar button.active{ color: var(--fresa-dark); }
  .tab-panel{ display:none; }
  .tab-panel.active{ display:block; }
  .tarea-grid{
    display:grid;
    grid-template-columns: minmax(0,1fr) minmax(0,1fr);
    gap: 10px;
  }
  .tarea-tile{
    border: 1.5px solid var(--linea);
    border-radius: 12px;
    padding: 16px 10px;
    background: #fff;
    color: var(--tinta);
    font-weight: 700;
    font-size: 14px;
    text-align:center;
    line-height:1.3;
    position: relative;
    cursor: pointer;
  }
  .tarea-tile .ic{ display:block; font-size:24px; margin-bottom:6px; }
  .tarea-tile.active{
    border-color: var(--fresa);
    background: #FCEFEF;
    outline: 2px solid var(--fresa);
  }
  .hidden{ display:none !important; }
  #loginOverlay{
    position:fixed; inset:0; background: linear-gradient(135deg, var(--moss) 0%, var(--moss-dark) 100%);
    z-index:999; display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .login-card{ background:#fff; border-radius:16px; padding:26px 22px; max-width:380px; width:100%; }
  .login-card h1{ font-family:Georgia,serif; font-size:22px; color:var(--moss-dark); text-align:center; margin:0 0 4px 0; }
  .login-card p{ text-align:center; font-size:12.5px; color:#8a8270; margin:0 0 18px 0; }
  .login-user-btn{
    width:100%; padding:14px; margin-bottom:10px; border-radius:10px; border:1.5px solid var(--linea);
    background:var(--crema); font-size:15px; font-weight:700; color:var(--tinta); text-align:left;
    display:flex; align-items:center; justify-content:space-between; cursor:pointer;
  }
  .sesion-bar{ display:flex; align-items:center; justify-content:space-between; padding:8px 0 2px; font-size:12.5px; opacity:0.9; }
  .sesion-bar button{ background:rgba(255,255,255,0.15); border:none; color:#fff; padding:5px 10px; border-radius:20px; font-size:11.5px; font-weight:700; }
</style>
</head>
<body>

<div id="loginOverlay">
  <div class="login-card">
    <h1>🍓 Invernadero</h1>
    <p>Selecciona tu usuario para entrar</p>
    <button class="login-user-btn" onclick="seleccionarUsuario('Mamá')">👩‍🌾 Mamá</button>
    <button class="login-user-btn" onclick="seleccionarUsuario('Empleado')">👨‍🌾 Empleado</button>
  </div>
</div>

<header>
  <h1>🍓 Invernadero</h1>
  <p>Registro diario · funciona sin internet</p>
  <div class="sesion-bar">
    <span id="sesionUsuarioTxt">Sin usuario</span>
    <button onclick="cerrarSesion()">Cambiar usuario</button>
  </div>
  <div id="syncEstadoBadge" class="sync-badge sync-badge--offline">● Conectando…</div>
</header>

<div class="wrap">

  <!-- TAB: NUEVO REGISTRO -->
  <div class="tab-panel active" id="tab-nuevo">
    <div class="card">
      <h2>Tipo de tarea</h2>
      <div class="tarea-grid">
        <div class="tarea-tile" data-tarea="Riego" onclick="seleccionarTarea(this)"><span class="ic">💧</span>Riego</div>
        <div class="tarea-tile" data-tarea="Cosecha" onclick="seleccionarTarea(this)"><span class="ic">🍓</span>Cosecha</div>
        <div class="tarea-tile" data-tarea="Fitosanitario" onclick="seleccionarTarea(this)"><span class="ic">🛡️</span>Fitosanitario</div>
        <div class="tarea-tile" data-tarea="Mantenimiento" onclick="seleccionarTarea(this)"><span class="ic">🔧</span>Mantenimiento</div>
      </div>
    </div>

    <div id="restoForm" class="hidden">
      <div class="card">
        <h2>Detalles y Notas</h2>
        <div id="camposEspecificos"></div>
        <label>Notas adicionales</label>
        <textarea id="notas" placeholder="Observaciones, cantidad cosechada, plaga detectada, etc."></textarea>
        <button class="btn-primary" onclick="agregarRegistro()">Agregar registro</button>
      </div>
    </div>

    <div class="card">
      <h2>Registros recientes</h2>
      <div id="listaRegistros"></div>
    </div>
  </div>

  <!-- TAB: NOTAS Y AVISOS -->
  <div class="tab-panel" id="tab-notas">
    <div class="card">
      <h2>Avisos y pendientes</h2>
      <label>Nuevo aviso</label>
      <input type="text" id="avisoInput" placeholder="Ej. Comprar fertilizante foliar">
      <button class="btn-secondary" onclick="agregarAviso()">+ Agregar aviso</button>
      <div class="chk-grid" id="listaAvisos" style="margin-top:12px;"></div>
    </div>
  </div>

</div>

<nav class="tabbar">
  <button class="active" onclick="cambiarTab('tab-nuevo', this)"><span class="ic">📝</span>Registro</button>
  <button onclick="cambiarTab('tab-notas', this)"><span class="ic">📌</span>Avisos</button>
</nav>

<script>
// ======================================================================
// 1. CONFIGURACIÓN E INICIALIZACIÓN DE FIREBASE
// ======================================================================
const firebaseConfig = {
  apiKey: "TU_API_KEY_AQUI",
  authDomain: "tu-proyecto.firebaseapp.com",
  projectId: "tu-proyecto-id",
  storageBucket: "tu-proyecto.appspot.com",
  messagingSenderId: "1234567890",
  appId: "1:1234567890:web:abcdef123456"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// 2. ACTIVAR SOPORTE OFFLINE AUTOMÁTICO
db.enablePersistence({ synchronizeTabs: true })
  .then(() => {
    actualizarBadgeSync('ok', '● Sin conexión (guardando local)');
  })
  .catch((err) => {
    if (err.code === 'failed-precondition') {
      console.warn('Persistencia offline limitada: Múltiples pestañas abiertas.');
    } else if (err.code === 'unimplemented') {
      console.warn('El navegador no soporta persistencia de datos local.');
    }
  });

window.addEventListener('online', () => actualizarBadgeSync('ok', '● En línea (sincronizado)'));
window.addEventListener('offline', () => actualizarBadgeSync('offline', '● Sin conexión (guardando local)'));

function actualizarBadgeSync(estado, texto) {
  const badge = document.getElementById('syncEstadoBadge');
  if (!badge) return;
  badge.className = `sync-badge sync-badge--${estado}`;
  badge.textContent = texto;
}

// ======================================================================
// 3. LÓGICA DE USUARIOS Y NAVEGACIÓN
// ======================================================================
function seleccionarUsuario(nombre) {
  document.getElementById('sesionUsuarioTxt').textContent = nombre;
  document.getElementById('loginOverlay').classList.add('hidden');
}

function cerrarSesion() {
  document.getElementById('loginOverlay').classList.remove('hidden');
}

function cambiarTab(tabId, btn) {
  document.querySelectorAll('.tab-panel').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('nav.tabbar button').forEach(el => el.classList.remove('active'));
  document.getElementById(tabId).classList.add('active');
  btn.classList.add('active');
}

function seleccionarTarea(el) {
  document.querySelectorAll('.tarea-tile').forEach(tile => tile.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('restoForm').classList.remove('hidden');
}

// ======================================================================
// 4. FUNCIONES DE LECTURA Y ESCRITURA EN TIEMPO REAL
// ======================================================================
function agregarRegistro() {
  const usuarioActivo = document.getElementById('sesionUsuarioTxt')?.textContent || 'Anonimo';
  const tipoTarea = document.querySelector('.tarea-tile.active')?.dataset?.tarea || 'General';
  const notasText = document.getElementById('notas')?.value || '';

  const datosRegistro = {
    usuario: usuarioActivo,
    tarea: tipoTarea,
    notas: notasText,
    fechaCreacion: firebase.firestore.FieldValue.serverTimestamp(),
    fechaFormato: new Date().toLocaleDateString('es-MX', { hour: '2-digit', minute: '2-digit' })
  };

  actualizarBadgeSync('saving', '● Guardando...');

  db.collection("registros").add(datosRegistro)
    .then(() => {
      limpiarFormulario();
      actualizarBadgeSync('ok', '● En línea (sincronizado)');
    })
    .catch((error) => {
      console.error("Error al guardar en Firestore:", error);
      actualizarBadgeSync('offline', '● Guardado localmente');
    });
}

function limpiarFormulario() {
  const notas = document.getElementById('notas');
  if (notas) notas.value = '';
  document.querySelectorAll('.tarea-tile').forEach(tile => tile.classList.remove('active'));
  document.getElementById('restoForm').classList.add('hidden');
}

function cargarRegistrosEnTiempoReal() {
  db.collection("registros")
    .orderBy("fechaCreacion", "desc")
    .limit(50)
    .onSnapshot((snapshot) => {
      const listaRegistros = [];
      snapshot.forEach((doc) => {
        listaRegistros.push({ id: doc.id, ...doc.data() });
      });
      renderizarListaRegistros(listaRegistros);
    });
}

function renderizarListaRegistros(registros) {
  const contenedor = document.getElementById('listaRegistros');
  if (!contenedor) return;

  if (registros.length === 0) {
    contenedor.innerHTML = '<div class="empty"><div class="big">🌱</div>Sin registros recientes</div>';
    return;
  }

  contenedor.innerHTML = registros.map(reg => `
    <div class="entry">
      <div class="entry-top">
        <span class="entry-title">${reg.tarea || 'Tarea'}</span>
        <span class="badge">${reg.usuario || 'Usuario'}</span>
      </div>
      <div class="entry-meta">🕒 ${reg.fechaFormato || 'Reciente'}</div>
      ${reg.notas ? `<div class="entry-notes">${reg.notas}</div>` : ''}
    </div>
  `).join('');
}

function agregarAviso() {
  const inputAviso = document.getElementById('avisoInput');
  const texto = inputAviso?.value?.trim();
  if (!texto) return;

  db.collection("avisos").add({
    texto: texto,
    completado: false,
    fecha: firebase.firestore.FieldValue.serverTimestamp()
  }).then(() => {
    inputAviso.value = '';
  });
}

function cargarAvisosEnTiempoReal() {
  db.collection("avisos")
    .orderBy("fecha", "desc")
    .onSnapshot((snapshot) => {
      const contenedor = document.getElementById('listaAvisos');
      if (!contenedor) return;

      contenedor.innerHTML = '';
      snapshot.forEach((doc) => {
        const aviso = doc.data();
        const row = document.createElement('div');
        row.className = 'chk-row';
        row.innerHTML = `
          <input type="checkbox" ${aviso.completado ? 'checked' : ''} onchange="toggleAviso('${doc.id}', this.checked)">
          <span style="${aviso.completado ? 'text-decoration:line-through; opacity:0.6;' : ''}">${aviso.texto}</span>
        `;
        contenedor.appendChild(row);
      });
    });
}

function toggleAviso(id, estado) {
  db.collection("avisos").doc(id).update({ completado: estado });
}

// ======================================================================
// 5. SERVICE WORKER Y EVENTOS DE INICIALIZACIÓN
// ======================================================================
document.addEventListener('DOMContentLoaded', () => {
  cargarRegistrosEnTiempoReal();
  cargarAvisosEnTiempoReal();
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW Error:', err));
  });
}
</script>

</body>
</html>
